{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical No-Show | Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}?v=2">
    <style>
        .auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
        .auth-card{width:100%;max-width:720px;padding:28px;border-radius:18px;background:var(--color-surface);box-shadow:0 18px 50px rgba(11,22,40,0.06)}
        .brand-badge{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--color-accent),var(--color-accent-2));color:white;font-weight:700;font-size:28px;margin:0 auto}
        .form-control{border-radius:12px}
        .btn-register{width:100%;border-radius:12px;padding:12px 16px}
        .login-link{text-align:center;margin-top:18px}
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-card">
            <div class="text-center">
                <div class="brand-badge">+</div>
                <h1 class="mt-2">Create account</h1>
                <p class="text-muted">Join Medical No-Show</p>
            </div>

            <form method="POST" class="mt-3">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-accent-2 btn-register mt-2">Register</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="{% url 'login' %}">Log in</a>
            </div>
        </div>
    </div>
</body>
</html>
