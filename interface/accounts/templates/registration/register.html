{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical No-Show | Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eaf6ff 0%, #f5f7ff 45%, #edfdf7 100%);
            font-family: Arial, sans-serif;
            padding: 32px 16px;
        }

        .register-shell {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .register-card {
            width: 100%;
            max-width: 520px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(13, 110, 253, 0.08);
            border-radius: 22px;
            box-shadow: 0 18px 50px rgba(13, 110, 253, 0.12);
            padding: 32px 28px;
        }

        .brand {
            text-align: center;
            margin-bottom: 26px;
        }

        .brand-badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: linear-gradient(135deg, #0d6efd, #44b3ff);
            color: white;
            font-size: 28px;
            box-shadow: 0 10px 20px rgba(13,110,253,0.25);
        }

        .brand h1 {
            margin: 0;
            font-size: 2rem;
            color: #123a6d;
        }

        .brand p {
            margin: 8px 0 0;
            color: #5b6b84;
        }

        form {
            margin-top: 12px;
        }

        form p {
            margin-bottom: 16px;
        }

        form label {
            display: block;
            font-weight: 600;
            color: #24476d;
            margin-bottom: 6px;
        }

        form input,
        form select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d8e3f0;
            border-radius: 12px;
            background: #f8fbff;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        form input:focus,
        form select:focus {
            outline: none;
            border-color: #4ea1ff;
            box-shadow: 0 0 0 4px rgba(78, 161, 255, 0.15);
            background: white;
        }

        .btn-register {
            width: 100%;
            margin-top: 8px;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: white;
            font-weight: 700;
            box-shadow: 0 12px 22px rgba(13,110,253,0.25);
        }

        .btn-register:hover {
            background: linear-gradient(135deg, #0b5ed7, #0a58ca);
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #5b6b84;
        }

        .login-link a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-shell">
        <div class="register-card">
            <div class="brand">
                <div class="brand-badge">+</div>
                <h1>Create account</h1>
                <p>Join Medical No-Show</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-register">Register</button>
            </form>

            <div class="login-link">
                Already have an account?
                <a href="{% url 'login' %}">Log in</a>
            </div>
        </div>
    </div>
</body>
</html>
