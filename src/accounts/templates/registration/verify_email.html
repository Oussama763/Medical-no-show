{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#eaf6ff,#f5f7ff);font-family:Arial,Helvetica,sans-serif}
        .card{max-width:520px;padding:28px;border-radius:18px}
        .brand-badge{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#0d6efd,#44b3ff);display:flex;align-items:center;justify-content:center;color:white;margin:0 auto 12px}
    </style>
</head>
<body>
<div class="card shadow-sm">
    <div class="text-center">
        <div class="brand-badge">+</div>
        <h3>Verify your email</h3>
        <p class="text-muted">We sent a 6-digit code to your email. Enter it below for <strong>{{ username }}</strong>.</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Verification code</label>
            <input name="code" class="form-control" placeholder="123456" maxlength="6" required>
        </div>
        <div class="d-grid">
            <button class="btn btn-primary">Verify</button>
        </div>
    </form>
    <hr>
    <div class="text-center mt-3">
        <form method="post" action="{% url 'resend_code' username %}">
            {% csrf_token %}
            <button class="btn btn-link">Resend code</button>
        </form>
    </div>
</div>
</body>
</html>
